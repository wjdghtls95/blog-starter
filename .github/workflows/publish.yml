name: Publish Post

on:
  repository_dispatch:
    types: [publish-post]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Move draft to posts
        id: move
        run: |
          DRAFT_FILE="${{ github.event.client_payload.draft_file }}"
          FILENAME=$(basename "$DRAFT_FILE")
          SLUG="${FILENAME%.md}"
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

          if [ ! -f "$DRAFT_FILE" ]; then
            echo "error=draft 파일 없음: $DRAFT_FILE" >> $GITHUB_OUTPUT
            exit 1
          fi

          mkdir -p src/content/posts
          cp "$DRAFT_FILE" "src/content/posts/$FILENAME"
          rm "$DRAFT_FILE"

      - name: Commit and push
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/ drafts/
          git diff --cached --quiet || git commit -m "publish: ${{ steps.move.outputs.slug }}"
          git push

      - name: blog-queue.md 업데이트 (KV 큐 → 발행됨)
        run: |
          python3 scripts/update-blog-queue.py "${{ steps.move.outputs.slug }}"
          git add blog-queue.md
          git diff --cached --quiet || git commit -m "docs: mark ${{ steps.move.outputs.slug }} as published"
          git push

      - name: Telegram — 발행 완료 알림
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SLUG="${{ steps.move.outputs.slug }}"
          BASE_URL="${{ secrets.BLOG_BASE_URL }}"
          MSG="✅ 발행 완료: ${SLUG}"$'\n'"${BASE_URL}/blog/${SLUG}/ (1~2분 후 반영)"
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}"

      - name: Telegram — 발행 실패 알림
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SLUG="${{ steps.move.outputs.slug }}"
          LOG_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ steps.move.outcome }}" = "failure" ]; then
            REASON="${{ steps.move.outputs.error }}"
            REASON="${REASON:-draft 파일 이동 실패}"
          elif [ "${{ steps.push.outcome }}" = "failure" ]; then
            REASON="git push 실패 (충돌 또는 권한 문제)"
          else
            REASON="알 수 없는 오류"
          fi

          MSG="❌ 발행 실패: ${SLUG}"$'\n'"원인: ${REASON}"$'\n'"로그: ${LOG_URL}"
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - uses: actions/deploy-pages@v4
        id: deployment
